name: Release

# v3+: builds the pure-Rust native app (native/), not the Tauri app.
# Triggered by pushing a version tag, e.g.  git tag v3.0.1 && git push origin v3.0.1
#
# Old Tauri installs (v2.x) poll releases/latest/download/latest.json for updates.
# This workflow publishes no latest.json, so they simply see no update; users move
# to v3 by downloading the .dmg once.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # Import the signing cert into a keychain and mark it trusted, so codesign can
      # resolve the identity (see conductor/SIGNING.md). Skipped when no cert is set;
      # the app is then ad-hoc signed.
      - name: Import macOS signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No signing certificate configured; building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-certificate -a -p "$KEYCHAIN_PATH" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build universal .app, .dmg and .zip
        working-directory: native
        env:
          UNIVERSAL: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/bundle-macos.sh

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Aran Terminal ${{ github.ref_name }}"
          body: |
            Aran Terminal is pure Rust: no webview, no JavaScript. v3.0.1+ updates itself
            (⬆ Update button in the header); v3.0.0 needs this one manual download.
            macOS: download the .dmg and drag to Applications. It isn't notarized, so on first
            launch allow it in System Settings → Privacy & Security → "Open Anyway"
            (or run `xattr -dr com.apple.quarantine "/Applications/Aran Terminal.app"`).
            Linux: .deb (Debian/Ubuntu), .rpm (Fedora/RHEL), .AppImage (any distro), or extract the .tar.gz and run `./aran`.
          files: |
            native/target/bundle/*.dmg
            native/target/bundle/*.zip

  linux:
    # After macOS, so only one job creates the release (no already_exists race).
    needs: macos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            rpm file

      # .tar.gz + .deb + .rpm + .AppImage (see native/scripts/bundle-linux.sh).
      - name: Build and package
        working-directory: native
        run: ./scripts/bundle-linux.sh

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Aran Terminal ${{ github.ref_name }}"
          files: |
            native/dist/*.tar.gz
            native/dist/*.deb
            native/dist/*.rpm
            native/dist/*.AppImage
